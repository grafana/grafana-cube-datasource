services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    container_name: 'grafana-itself'
    build:
      args:
        grafana_version: ${GRAFANA_VERSION:-13.2.4}
        grafana_image: ${GRAFANA_IMAGE:-grafana}
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/cubeds-ecom-full-data-model.json
      GF_FEATURE_TOGGLES_ENABLE: 'tableNextGen,queryLibrary,sqlExpressions,dashboardDsAdHocFiltering,adhocFiltersInTooltips,enableDashboardMigration'
      # Panels used by the RevOps Territory Navigator dashboards
      GF_PLUGINS_PREINSTALL: 'marcusolsson-dynamictext-panel@6.3.0,volkovlabs-table-panel@3.6.8'
    depends_on:
      - cube

  cube:
    image: cubejs/cube:latest@sha256:a7c31de6c0e8618169bbde808f9e2c8da9c1c0c1924803e66619b6e91c02c730
    ports:
      - 4000:4000
      - 15432:15432
    volumes:
      - ./dev-environment/cube:/cube/conf
    depends_on:
      - postgres

  postgres:
    image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jaffle_shop
    ports:
      - '5432:5432'
    volumes:
      - ./dev-environment/data/seeds/:/data/seeds/
      - ./dev-environment/data/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
      # init.sql only runs on an empty volume, so later starts skip loading. Reset with `docker compose down -v`.
      - postgres-data:/var/lib/postgresql
    # Checked over TCP: the entrypoint's temporary init server only listens on the socket.
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'user', '-d', 'jaffle_shop']
      interval: 2s
      start_period: 120s
    # Enable SQL queries in the logs (minimal output)
    command:
      [
        'postgres',
        '-c',
        'log_statement=all',
        '-c',
        'log_line_prefix=',
        '-c',
        'log_duration=off',
        '-c',
        'log_parameter_max_length=0',
      ]

  # Drops and reloads the RevOps tables on every `docker compose up`, then exits.
  revops-seed:
    image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      PGPASSWORD: password
    volumes:
      - ./dev-environment/data/migrations/revops.sql:/revops.sql:ro
    command: ['psql', '-h', 'postgres', '-U', 'user', '-d', 'jaffle_shop', '-v', 'ON_ERROR_STOP=1', '--single-transaction', '-f', '/revops.sql']
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
