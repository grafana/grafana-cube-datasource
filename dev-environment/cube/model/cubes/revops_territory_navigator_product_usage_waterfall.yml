cubes:
  - name: revops_territory_navigator_product_usage_waterfall
    sql: |
      WITH base_product_usage AS (
        SELECT account_id, 'Visualization' AS product_label, 1 AS product_sort, COALESCE(NULLIF(uses_visualization_status, ''), 'Not Using') AS actual_usage_status
        FROM revops.revops_reporting_territory_navigator_account_details
        UNION ALL
        SELECT account_id, 'Metrics' AS product_label, 2 AS product_sort, COALESCE(NULLIF(uses_metrics_status, ''), 'Not Using') AS actual_usage_status
        FROM revops.revops_reporting_territory_navigator_account_details
        UNION ALL
        SELECT account_id, 'Logs' AS product_label, 3 AS product_sort, COALESCE(NULLIF(uses_logs_status, ''), 'Not Using') AS actual_usage_status
        FROM revops.revops_reporting_territory_navigator_account_details
        UNION ALL
        SELECT account_id, 'Traces' AS product_label, 4 AS product_sort, COALESCE(NULLIF(uses_traces_status, ''), 'Not Using') AS actual_usage_status
        FROM revops.revops_reporting_territory_navigator_account_details
        UNION ALL
        SELECT account_id, 'Profiles' AS product_label, 5 AS product_sort, COALESCE(NULLIF(uses_profiles_status, ''), 'Not Using') AS actual_usage_status
        FROM revops.revops_reporting_territory_navigator_account_details
        UNION ALL
        SELECT account_id, 'K6' AS product_label, 6 AS product_sort, COALESCE(NULLIF(uses_k6_status, ''), 'Not Using') AS actual_usage_status
        FROM revops.revops_reporting_territory_navigator_account_details
        UNION ALL
        SELECT account_id, 'Synthetics' AS product_label, 7 AS product_sort, COALESCE(NULLIF(uses_synthetics_status, ''), 'Not Using') AS actual_usage_status
        FROM revops.revops_reporting_territory_navigator_account_details
        UNION ALL
        SELECT account_id, 'FE O11y' AS product_label, 8 AS product_sort, COALESCE(NULLIF(uses_frontend_observability_status, ''), 'Not Using') AS actual_usage_status
        FROM revops.revops_reporting_territory_navigator_account_details
        UNION ALL
        SELECT account_id, 'App O11y' AS product_label, 9 AS product_sort, COALESCE(NULLIF(uses_application_observability_status, ''), 'Not Using') AS actual_usage_status
        FROM revops.revops_reporting_territory_navigator_account_details
        UNION ALL
        SELECT account_id, 'K8s Monitoring' AS product_label, 10 AS product_sort, COALESCE(NULLIF(uses_kubernetes_monitoring_status, ''), 'Not Using') AS actual_usage_status
        FROM revops.revops_reporting_territory_navigator_account_details
        UNION ALL
        SELECT account_id, 'IRM' AS product_label, 11 AS product_sort, COALESCE(NULLIF(uses_irm_status, ''), 'Not Using') AS actual_usage_status
        FROM revops.revops_reporting_territory_navigator_account_details
      ),
      usage_statuses AS (
        SELECT '🔵 Currently Using' AS usage_status
        UNION ALL
        SELECT '🟠 Used in Last 3 Months' AS usage_status
        UNION ALL
        SELECT 'Not Using' AS usage_status
      )
      SELECT
        b.account_id,
        b.product_label,
        b.product_sort,
        s.usage_status,
        CASE WHEN b.actual_usage_status = s.usage_status THEN 1 ELSE 0 END AS account_match
      FROM base_product_usage b
      CROSS JOIN usage_statuses s
    data_source: default

    measures:
      - name: count_distinct_accounts
        type: sum
        sql: account_match
        title: "Matching Accounts"
        description: "Number of accounts matching the given product and usage status combination"

    dimensions:
      - name: row_id
        sql: "CONCAT(CAST(account_id AS TEXT), '|', CAST(product_sort AS TEXT), '|', usage_status)"
        type: string
        primary_key: true
        description: "Composite primary key (account_id | product_sort | usage_status)"

      - name: account_id
        sql: account_id
        type: string
        description: "Salesforce account ID"

      - name: product_label
        sql: product_label
        type: string
        description: "Grafana product name (e.g. Metrics, Logs, Traces, K6, IRM)"

      - name: product_sort
        sql: product_sort
        type: number
        description: "Numeric sort order for the product label (1=Visualization, 2=Metrics, ... 11=IRM)"

      - name: usage_status
        sql: usage_status
        type: string
        description: "Product adoption status: Currently Using, Used in Last 3 Months, or Not Using"
