views:
  - name: territory_navigator
    description: "Accounts and their opportunities, for the RevOps demo dashboards"
    cubes:
      - join_path: revops_accounts
        includes:
          - count
          - account_id
          - account_name
          - region
          - sub_region
          - segment
          - account_owner
          - solutions_engineer
          - funnel_stage_number
          - funnel_stage
          - tam_category
          - behavior_signal
          - sales_activity_pulse

      - join_path: revops_accounts.revops_opportunities
        includes:
          - name: opp_id
            alias: opp_id
          - name: opp_type
            alias: opp_type
          - name: stage_name
            alias: opp_stage
          - name: stage_number
            alias: opp_stage_number
          - name: close_date
            alias: opp_close_date
          - name: fiscal_quarter
            alias: opp_fiscal_quarter
          - name: total_nacv
            alias: opp_total_nacv
          - name: val_qp
            alias: opp_qp_nacv
          - name: count_distinct_accounts_with_qp
            alias: opp_accounts_w_qp
          - name: share_accounts_with_qualified_pipeline
            alias: opp_accounts_with_qp_share
