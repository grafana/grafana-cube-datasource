views:
  - name: territory_navigator
    description: "Unified view joining all territory navigator related tables"
    cubes:
      # Main account details cube
      - join_path: revops_territory_navigator_account_details
        includes:
          # Measures
          - count
          - total_arr
          - total_arr_cloud
          - total_arr_enterprise
          - total_mrr
          - total_consumption_last_month
          - total_committed_mrr_last_month
          - total_consumption_projected
          - total_committed_mrr_current
          - total_consumption_quota_last_month
          - consumption_quota_attainment_last_month
          - name: total_consumption_with_quota_last_month
            alias: total_consumption_w_quota_lm
          - name: total_consumption_with_committed_mrr_last_month
            alias: total_consumption_w_mrr_lm
          - total_consumption_quota_current_month
          - name: total_consumption_projected_with_quota
            alias: total_consumption_proj_w_quota
          - name: total_consumption_projected_with_committed_mrr
            alias: total_consumption_proj_w_mrr
          - total_opt_ins
          - total_contacted_l6m

          # Account identifiers
          - account_id
          - account_name
          - name: account_org_id_sfdc
            alias: org_id
          - name: account_org_slug_sfdc
            alias: org_slug

          # Territory parent
          - name: account_id_territory_parent
            alias: parent_account_id
          - name: account_name_territory_parent
            alias: parent_name
          - name: account_org_id_sfdc_territory_parent
            alias: parent_org_id
          - name: account_org_slug_sfdc_territory_parent
            alias: parent_org_slug
          - name: is_territory_parent
            alias: is_parent
          - name: is_territory_parent_filter
            alias: is_parent_filter
          - name: is_territory_parent_display
            alias: is_parent_display
          - name: is_territory_parent_one_hot
            alias: is_parent_flag
          - name: employee_ct_territory_parent
            alias: parent_employee_count

          # Account owner
          - name: account_owner_id
            alias: owner_id
          - name: account_owner_region
            alias: owner_region
          - name: account_owner_rvp_region
            alias: rvp_region
          - name: account_owner_rsd_region
            alias: rsd_region
          - name: account_owner_segment
            alias: owner_segment
          - name: account_owner_seller_type
            alias: seller_type
          - name: account_owner_name
            alias: owner_name

          # SDR
          - name: account_mapped_sdr_id
            alias: sdr_id
          - name: account_mapped_sdr_name
            alias: sdr_name

          # Solutions Engineer
          - name: account_solutions_engineer_id
            alias: se_id
          - name: account_solutions_engineer_name
            alias: se_name

          # Observability Architect
          - name: account_observability_architect_id
            alias: oa_id
          - name: account_observability_architect_name
            alias: oa_name
          - name: account_observability_architect_manager_id
            alias: oa_manager_id
          - name: account_observability_architect_manager_name
            alias: oa_manager_name

          # Territory
          - name: account_territory_name
            alias: territory
          - name: is_account_assigned_to_ae_filter
            alias: is_ae_assigned

          # Industry
          - name: account_industry_zoominfo
            alias: industry
          - name: account_sub_industry_zoominfo
            alias: sub_industry

          # Billing
          - name: account_billing_country
            alias: billing_country
          - name: account_billing_state_province
            alias: billing_state
          - name: account_billing_city
            alias: billing_city
          - name: account_billing_postal_code
            alias: postal_code

          # Funnel
          - name: account_funnel_score_number
            alias: funnel_score
          - name: account_funnel_score_name
            alias: funnel_stage
          - usage_type_name
          - name: usage_type_name_curr
            alias: usage_type

          # Marketing ops signals
          - name: company_behavior_signal_marketing_ops
            alias: behavior_signal
          - name: company_behavior_signal_description_marketing_ops
            alias: behavior_signal_detail
          - name: sales_activity_pulse_marketing_ops
            alias: sales_activity_pulse
          - name: sales_activity_pulse_description_marketing_ops
            alias: sales_activity_detail
          - name: ct_opt_ins_marketing_ops
            alias: opt_in_count
          - name: ct_opt_ins_contacted_l6m_marketing_ops
            alias: opt_ins_contacted_6m
          - name: share_opt_ins_contacted_l6m_marketing_ops
            alias: opt_in_contact_rate_6m
          - name: last_response_date_marketing_ops
            alias: last_marketing_response
          - name: ct_responses_cloud_l30d_marketing_ops
            alias: cloud_responses_30d
          - name: ct_responses_non_cloud_l30d_marketing_ops
            alias: non_cloud_responses_30d
          - name: ct_unique_visitors_l30d_marketing_ops
            alias: unique_visitors_30d
          - name: ct_page_views_buying_intent_l30d_marketing_ops
            alias: buying_intent_views_30d
          - name: ct_community_activities_l30d_marketing_ops
            alias: community_activity_30d

          # Engagement
          - has_ae_sdr_meeting
          - has_ae_sdr_meeting_display
          - has_other_ae_sdr_engagement
          - name: has_other_ae_sdr_engagement_display
            alias: other_engagement_display

          # TAM & Warmth
          - name: tam_category_family
            alias: tam_category
          - name: warmth_rank_warmth_model
            alias: warmth_rank

          # ARR / MRR
          - arr_curr
          - arr_cloud_curr
          - arr_enterprise_curr
          - arr_curr_family
          - mrr_curr
          - name: avg_mrr_self_serve_l3m
            alias: self_serve_mrr_3m_avg

          # Consumption - Last Month
          - name: consumption_weighted_last_month
            alias: consumption_last_month
          - name: consumption_weighted_quota_last_month
            alias: consumption_quota_lm
          - committed_mrr_last_month
          - name: consumption_weighted_last_month_with_quota
            alias: consumption_w_quota_lm
          - name: consumption_weighted_last_month_with_committed_mrr
            alias: consumption_w_mrr_lm
          - name: consumption_weighted_quota_attainment_last_month
            alias: quota_attainment_lm
          - name: consumption_attainment_band_name_last_month
            alias: quota_band_lm
          - name: consumption_attainment_band_description_last_month
            alias: quota_band_detail_lm
          - name: consumption_weighted_committed_mrr_attainment_last_month
            alias: mrr_attainment_lm
          - name: consumption_committed_mrr_attainment_band_name_last_month
            alias: mrr_band_lm
          - name: consumption_committed_mrr_attainment_band_number_last_month
            alias: mrr_band_sort_lm
          - name: cons_committed_mrr_attainment_band_description_last_month
            alias: mrr_band_detail_lm

          # Consumption - Current Month
          - name: consumption_weighted_projected_current_month
            alias: consumption_projected
          - name: consumption_weighted_quota_current_month
            alias: consumption_quota_curr
          - committed_mrr_current_month
          - name: consumption_weighted_projected_current_month_with_quota
            alias: consumption_w_quota_projected
          - name: consumption_weighted_projected_current_month_with_committed_mrr
            alias: consumption_w_mrr_projected
          - name: consumption_weighted_quota_attainment_projected_current_month
            alias: quota_attainment_projected
          - name: consumption_attainment_band_name_projected_current_month
            alias: quota_band_projected
          - name: consumption_attainment_band_description_projected_current_month
            alias: quota_band_detail_projected
          - name: consumption_weighted_projected_current_month_quota_contribution
            alias: quota_gap_projected
          - name: cons_weighted_committed_mrr_attainment_proj_curr_month
            alias: mrr_attainment_projected
          - name: cons_committed_mrr_attainment_band_name_proj_curr_month
            alias: mrr_band_projected
          - name: cons_committed_mrr_attainment_band_number_proj_curr_month
            alias: mrr_band_sort_projected
          - name: cons_committed_mrr_attainment_band_description_proj_curr_month
            alias: mrr_band_detail_projected
          - name: consumption_weighted_projected_current_month_delta_mom
            alias: consumption_mom_change
          - name: consumption_weighted_projected_current_month_delta_mom_display
            alias: consumption_mom_display
          - name: consumption_weighted_projected_current_month_gap_to_current_mrr
            alias: consumption_vs_mrr_gap

          # Subscription
          - name: subscription_commit_balance_bom_ttl
            alias: commit_balance_bom
          - name: share_subscription_init_commit_consumed_bom_ttl
            alias: commit_consumed_pct_bom
          - name: subscription_details_string
            alias: subscription_summary

          # Renewal
          - name: close_date_next_renewal
            alias: next_renewal_date
          - name: months_to_close_date_next_renewal
            alias: months_to_renewal

          # Product usage status
          - name: string_products_in_use_projected_current_month
            alias: products_in_use
          - name: uses_visualization_status
            alias: viz_status
          - name: uses_metrics_status
            alias: metrics_status
          - name: uses_logs_status
            alias: logs_status
          - name: uses_traces_status
            alias: traces_status
          - name: uses_profiles_status
            alias: profiles_status
          - name: uses_k6_status
            alias: k6_status
          - name: uses_synthetics_status
            alias: synthetics_status
          - name: uses_frontend_observability_status
            alias: feo_status
          - name: uses_application_observability_status
            alias: app_o11y_status
          - name: uses_kubernetes_monitoring_status
            alias: k8s_mon_status
          - name: uses_irm_status
            alias: irm_status

          # Clay / External data
          - name: ct_employees_devops_clay
            alias: devops_employees
          - name: marquee_list_clay
            alias: marquee_list
          - name: marquee_list_clay_display
            alias: marquee_list_display
          - name: latest_funding_round_clay
            alias: latest_funding_round
          - name: total_funding_amount_clay_family
            alias: family_funding_total
          - technology_list
          - name: crossbeam_overlap_summary
            alias: crossbeam_overlap

          # CX / Sales scores
          - name: cx_happiness_score
            alias: cx_score
          - name: cx_happiness_score_display
            alias: cx_score_display
          - name: sales_happiness_score
            alias: sales_health
          - name: sales_happiness_score_display
            alias: sales_health_display

          # Timestamp
          - updated_timestamp

      # Opportunity splits (joined via account_id)
      - join_path: revops_territory_navigator_account_details.revops_reporting_opp_split
        includes:
          - name: opp_id
            alias: opp_id
          - name: opp_name
            alias: opp_name
          - name: opp_type_qbr
            alias: opp_type
          - name: stage_name
            alias: opp_stage
          - name: stage_number
            alias: opp_stage_number
          - name: close_date
            alias: opp_close_date
          - name: fq_close_date
            alias: opp_fiscal_quarter
          - name: net_nacv_split
            alias: opp_nacv_split
          - name: net_nacv_ttl
            alias: opp_nacv_total
          - name: net_racv_split
            alias: opp_racv_split
          - name: net_racv_ttl
            alias: opp_racv_total
          - name: net_tcv_split
            alias: opp_tcv_split
          - name: services_split
            alias: opp_services
          - name: split_percentage
            alias: opp_split_pct
          - name: is_cro_forecast
            alias: opp_cro_forecast
          - name: is_vp_forecast
            alias: opp_vp_forecast
          - name: is_rvp_forecast
            alias: opp_rvp_forecast
          - name: is_rsd_forecast
            alias: opp_rsd_forecast
          - name: is_ae_forecast
            alias: opp_ae_forecast
          - name: count
            alias: opp_count
          # Aggregate measures
          - name: total_nacv
            alias: opp_total_nacv
          - name: total_racv
            alias: opp_total_racv
          - name: total_tcv
            alias: opp_total_tcv
          - name: total_services
            alias: opp_total_services
          - name: val_qp
            alias: opp_qp_nacv
          - name: ct_qp
            alias: opp_qp_count
          - name: val_cw
            alias: opp_cw_nacv
          - name: ct_cw
            alias: opp_cw_count
          - name: share_accounts_with_qualified_pipeline
            alias: opp_accounts_with_qp_share
          - name: count_distinct_accounts_with_qp
            alias: opp_accounts_w_qp
          - name: count_distinct_accounts_closed_won
            alias: opp_accounts_cw
          - name: count_distinct_accounts
            alias: opp_total_accounts
          - name: val_open_renewal
            alias: opp_open_renewal_racv
          - name: ct_open_renewal
            alias: opp_open_renewal_count
          - name: count_distinct_open_renewal_accounts
            alias: opp_renewal_accounts

      # Product usage waterfall (unpivoted from usage status columns)
      - join_path: revops_territory_navigator_account_details.revops_territory_navigator_product_usage_waterfall
        includes:
          - name: product_label
            alias: product_label
          - name: product_sort
            alias: product_sort
          - name: usage_status
            alias: product_usage_status
          - name: count_distinct_accounts
            alias: product_usage_accounts
