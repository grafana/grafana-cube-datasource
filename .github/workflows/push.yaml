# Simple example for using the shared workflows for plugins provided by plugin-ci-workflows.
# All inputs are documented in the workflow files themselves:
# https://github.com/grafana/plugin-ci-workflows/tree/main/.github/workflows
# Additional documentation is also available on EngHub, here:
# https://enghub.grafana-ops.net/docs/default/component/grafana-plugins-platform/plugins-ci-github-actions/010-plugins-ci-github-actions/#customizing-the-workflows-with-inputs

name: Plugins - CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  check-lockfile-drift:
    name: Check for package-lock.json drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies (fails if lockfile is out of sync)
        run: npm ci

      # `npm ci` above only checks dependencies/devDependencies. npm never writes
      # `overrides` into the lockfile, so an override can be bumped in package.json
      # while the lockfile keeps resolving the old version - silently, as in #550.
      - name: Check declared overrides are honoured by the lockfile
        run: node .github/scripts/check-lockfile-overrides.mjs

  ci:
    name: CI
    uses: grafana/plugin-ci-workflows/.github/workflows/ci.yml@ci-cd-workflows/v11.1.0
    permissions:
      contents: read
      id-token: write
    with:
      plugin-version-suffix: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
      # PoC: run plugin-validator only on pushes to main, not on every PR.
      # The validator (docker pull + osv-scanner + analyzers) adds ~1.5 min to the
      # required 'Test and build plugin' check, and a single flagged CVE anywhere in
      # the lockfile turns EVERY open PR red (as happened with fast-uri CVE-2026-18446).
      # Dependabot/Socket/renovate already surface CVEs on PRs; keep the validator as
      # a release gate on main instead of a merge gate on PRs.
      run-plugin-validator: ${{ github.event_name == 'push' }}
      plugin-validator-config-path: .plugin-validator.yaml
      # Skip the grafana-nightly image in Playwright tests (image may be temporarily unavailable)
      run-playwright-with-skip-grafana-nightly-image: true
      # PoC: run e2e against a single, reliable Grafana version (latest patch of the
      # minimum supported minor) instead of every minor in the grafanaDependency range.
      # Recent history: 12.2.x/12.3.x/12.4.x/13.1.x all green, 13.0.4 permafailing
      # ("Wait for Grafana to start"), so the full matrix only added noise + wall-clock.
      # Now tracks the React 19 floor: the plugin requires Grafana >=13.2.0, so
      # earlier minors can no longer resolve the externalized react/jsx-runtime.
      run-playwright-with-grafana-dependency: '~13.2.0'

      # TODO: add here any other CI custom inputs you may need. You most likely also have to add the same options to publish.yaml:
      #   https://enghub.grafana-ops.net/docs/default/component/grafana-plugins-platform/plugins-ci-github-actions/010-plugins-ci-github-actions/#customizing-the-workflows-with-inputs
